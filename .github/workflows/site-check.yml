# Daily check that the website opens over HTTPS and that the certificate visitors get is not about to expire.
# When it fails, GitHub emails the repository owner.
#
# Why this exists: on 4 October 2026 GitHub's certificate for the domain expired (GitHub cannot renew it behind
# the Cloudflare proxy), Cloudflare was on "Full (strict)" and refused it, and the site answered error 526 for
# two days. The setup that works is described in README.md: proxied at Cloudflare, SSL/TLS mode "Full".
name: Site check

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pages open over HTTPS
        run: |
          for url in https://myshiftplanner.app/ https://myshiftplanner.app/nurse/ https://myshiftplanner.app/de/nurse/ https://www.myshiftplanner.app/; do
            code=$(curl -sS -L -o /dev/null -w "%{http_code}" --max-time 30 "$url" || echo "000")
            echo "$url -> $code"
            if [ "$code" != "200" ]; then
              echo "::error::$url does not open (answer: $code). An answer of 526 means Cloudflare's SSL/TLS mode for myshiftplanner.app is no longer \"Full\": set it back (see README.md)."
              exit 1
            fi
          done
      - name: Certificate has at least 14 days left
        run: |
          end=$(echo | openssl s_client -connect myshiftplanner.app:443 -servername myshiftplanner.app 2>/dev/null | openssl x509 -noout -enddate | cut -d= -f2)
          days=$(( ( $(date -d "$end" +%s) - $(date +%s) ) / 86400 ))
          echo "The certificate is valid until $end ($days days left)."
          if [ "$days" -lt 14 ]; then
            echo "::error::Only $days days left on the certificate visitors get, so it is not being renewed. See README.md for how the site is set up at Cloudflare."
            exit 1
          fi
